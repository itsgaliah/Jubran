<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My iPhone</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="phone">

    <div class="lock-screen">

      <div class="status-bar">
        <span>9:41</span>
        <span>●●●  WiFi  ▰</span>
      </div>

      <div class="lock-content">
        <p class="day">Tuesday, November 24</p>
        <h1 id="clock">9:41</h1>
        <p class="welcome">Welcome to my phone</p>
      </div>

      <div class="widgets">
        <div class="widget">☁️<br>Weather</div>
        <div class="widget">📅<br>Calendar</div>
      </div>

      <div class="bottom-icons">
        <button>🔦</button>
        <button>📷</button>
      </div>

      <div class="swipe">
        Swipe up to unlock
      </div>

      <button class="unlock" onclick="unlockPhone()">
        Unlock
      </button>

    </div>

    <section id="home-screen" class="home-screen hidden">
      <h2>Home Screen</h2>
      <p>Your apps will appear here.</p>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
