
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Phone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="phone">
    <div class="status">
      <span>9:41</span>
      <span>●●●  WiFi  🔋</span>
    </div>

    <h1>My Phone</h1>
    <p class="date">Tuesday, November 24</p>

    <section class="apps">
      <button class="app" data-app="Messages">
        <span class="app-icon messages">💬</span>
        Messages
      </button>

      <button class="app" data-app="Photos">
        <span class="app-icon photos">🌄</span>
        Photos
      </button>

      <button class="app" data-app="Notes">
        <span class="app-icon notes">📝</span>
        Notes
      </button>

      <button class="app" data-app="Music">
        <span class="app-icon music">🎵</span>
        Music
      </button>

      <button class="app" data-app="Settings">
        <span class="app-icon settings">⚙️</span>
        Settings
      </button>

      <button class="app" data-app="Camera">
        <span class="app-icon camera">📷</span>
        Camera
      </button>
    </section>

    <section class="screen" id="screen">
      <h2>Welcome!</h2>
      <p>Choose an app to open.</p>
    </section>

    <button class="home-button" id="home">Home</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
