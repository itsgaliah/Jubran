
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My iPhone</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="phone">

    <div class="lock-screen">

      <div class="status-bar">
        <span>9:41</span>
        <span>●●●  WiFi  ▰</span>
      </div>

      <div class="lock-content">
        <p class="day">Tuesday, November 24</p>
        <h1 id="clock">9:41</h1>
        <p class="welcome">Welcome to my phone</p>
      </div>

      <div class="widgets">
        <div class="widget">☁️<br>Weather</div>
        <div class="widget">📅<br>Calendar</div>
      </div>

      <div class="bottom-icons">
        <button>🔦</button>
        <button>📷</button>
      </div>

      <div class="swipe">
        Swipe up to unlock
      </div>

      <button class="unlock" onclick="unlockPhone()">
        Unlock
      </button>

    </div>

    
<section id="home-screen" class="home-screen hidden">

  <div class="home-status">
    <span>9:41</span>
    <span>●●● WiFi ▰</span>
  </div>

  <div class="app-grid">

    <button class="app" data-app="Messages">
      <span class="app-icon green">💬</span>
      Messages
    </button>

    <button class="app" data-app="Phone">
      <span class="app-icon green">📞</span>
      Phone
    </button>

    <button class="app" data-app="Photos">
      <span class="app-icon white">🌈</span>
      Photos
    </button>

    <button class="app" data-app="Camera">
      <span class="app-icon gray">📷</span>
      Camera
    </button>

    <button class="app" data-app="TikTok">
      <span class="app-icon black">♪</span>
      TikTok
    </button>

    <button class="app" data-app="Instagram">
      <span class="app-icon pink">📸</span>
      Instagram
    </button>

    <button class="app" data-app="Notes">
      <span class="app-icon yellow">📝</span>
      Notes
    </button>

    <button class="app" data-app="Settings">
      <span class="app-icon gray">⚙️</span>
      Settings
    </button>

  </div>

  <div class="dock">
    <button class="app" data-app="Phone">
      <span class="app-icon green">📞</span>
    </button>

    <button class="app" data-app="Messages">
      <span class="app-icon green">💬</span>
    </button>

    <button class="app" data-app="Photos">
      <span class="app-icon white">🌈</span>
    </button>

    <button class="app" data-app="Music">
      <span class="app-icon pink">🎵</span>
    </button>
  </div>

</section>


<section id="app-screen" class="app-screen hidden">

  <button id="back-home">← Home</button>

  <div id="generic-app">
    <h2 id="app-title"></h2>
    <p id="app-content"></p>
  </div>

  <div id="messages-app" class="messages-app hidden">

    <h2>Messages</h2>
    <p class="message-subtitle">Your conversations</p>

    <form id="add-contact-form">
      <input id="contact-name" type="text"
        placeholder="Person's name" required>

<label for="contact-photo">Choose a photo</label>

<input id="contact-photo" type="file"
  accept="image/*">

      <button type="submit">+ Add Contact</button>
    </form>

    <div id="conversation-list"></div>

    <div id="chat-view" class="hidden">
      <button id="back-messages">← Conversations</button>

      <h3 id="chat-name"></h3>

      <div id="chat-messages"></div>

      <form id="send-message-form">
        <input id="message-input" type="text"
          placeholder="iMessage" required>
        <button type="submit">Send</button>
      </form>
    </div>

  </div>

</section>


    
  </main>

  <script src="script.js"></script>

</body>
</html>
